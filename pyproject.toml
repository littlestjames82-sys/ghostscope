[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostscope"
version = "0.1.0"
description = "PR and diff review slicer for GhostSlice: change-centred review packs with blast radius, risk reasons, and covering tests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "code-review", "diff", "context", "ghostslice", "agents"]
dependencies = []

[project.scripts]
ghostscope = "ghostscope.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
